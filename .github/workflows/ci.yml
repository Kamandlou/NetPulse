name: CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Build & Test NetPulse
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          for xc in /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.0.app /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$xc" ]; then
              echo "==> Selecting Xcode: $xc"
              sudo xcode-select -switch "$xc"
              break
            fi
          done
          echo "Active developer directory: $(xcode-select -p)"
          swift --version

      - name: Run Automated Tests
        run: swift test

      - name: Build Application Bundle & Packages
        run: bash scripts/build_app.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-macOS-Build
          path: |
            build/NetPulse-*.zip
            build/NetPulse-*.dmg
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/NetPulse-*.dmg
            build/NetPulse-*.zip
          name: "NetPulse ${{ github.ref_name }}"
          body: |
            ### NetPulse — Native macOS Internet Connectivity Monitor (${{ github.ref_name }})

            A lightweight, privacy-friendly native macOS menu bar application that continuously monitors real internet connectivity and notifies users when their internet connection drops or recovers.

            #### 📦 Download
            - **macOS Disk Image (Installer)**: [NetPulse-1.2.2.dmg](https://github.com/Kamandlou/NetPulse/releases/download/${{ github.ref_name }}/NetPulse-1.2.2.dmg)
            - **ZIP Archive**: [NetPulse-1.2.2.zip](https://github.com/Kamandlou/NetPulse/releases/download/${{ github.ref_name }}/NetPulse-1.2.2.zip)

            #### 💻 Compatibility
            - macOS 14 Sonoma, macOS 15 Sequoia, and newer
            - Runs natively on Apple Silicon (M1/M2/M3/M4) and Intel Macs

            #### 🚀 What's New in v1.2.2
            - **Dark Mode Contrast Optimization**: Replaced opaque control backgrounds with frosted Apple native materials (`.regularMaterial` and `.ultraThinMaterial`). Pop-up card now blends seamlessly against dark wallpapers and windows.
            - **Typography & Layout Polish**: Truncation-free metric titles and softer harmonious color accents.
          draft: false
          prerelease: false
